name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gardeniot

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build, unit and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage (JaCoCo, line)"
            echo
            echo "| Module | Covered | Missed | Line coverage |"
            echo "|---|---:|---:|---:|"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              module=$(echo "$csv" | cut -d/ -f1)
              awk -F, -v m="$module" 'NR>1 {c+=$9; x+=$8} END {if (c+x>0) printf "| %s | %d | %d | %.1f%% |\n", m, c, x, 100*c/(c+x)}' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/target/site/jacoco/
          if-no-files-found: ignore

      - name: Keep the jars for the image job
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            controller/target/controller.jar
            simulated-device/target/simulated-device.jar
            garden-ui/target/garden-ui.jar
          if-no-files-found: error

  images:
    name: Container image (${{ matrix.module }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module: [controller, simulated-device, garden-ui]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.module }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.module }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.module }}:scan
          format: sarif
          output: trivy-${{ matrix.module }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.module }}.sarif
          category: trivy-${{ matrix.module }}

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the image (keyless, Sigstore)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
      - if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.module }}
          DIGEST: ${{ steps.push.outputs.digest }}

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/gardeniot
      - run: helm template gardeniot deploy/helm/gardeniot > /dev/null
      - name: Render the azure profile too
        run: |
          helm template gardeniot deploy/helm/gardeniot \
            --set transport=azure --set azure.hubHostName=h.azure-devices.net \
            --set azure.eventHubNamespace=ns --set azure.eventHubName=eh \
            --set azure.deviceConnectionStringSecret=dev --set device.replicas=1 > /dev/null

  terraform:
    name: Terraform (Azure)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform/azure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  kind:
    name: Kubernetes smoke test
    needs: [build, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: gardeniot
          install_only: true

      - name: Build the images with the shared cache
        run: |
          for module in controller simulated-device garden-ui; do
            docker buildx build --load --build-arg MODULE=$module \
              --cache-from type=gha --cache-to type=gha,mode=max \
              -t ghcr.io/jehelmich/gardeniot-$module:local .
          done

      - name: Install on kind
        run: scripts/kind-up.sh --set device.telemetryIntervalSeconds=1 --set device.actionDurationSeconds=1

      - name: Wait for the first watering
        run: |
          for i in $(seq 1 60); do
            if kubectl -n gardeniot logs deploy/gardeniot-controller 2>/dev/null | grep -q "answered 202"; then
              echo "watered"; exit 0
            fi
            sleep 3
          done
          echo "no watering within 3 minutes" >&2
          kubectl -n gardeniot get pods
          kubectl -n gardeniot logs deploy/gardeniot-controller --tail=50
          kubectl -n gardeniot logs statefulset/gardeniot-device --tail=50
          exit 1

      - name: Metrics are scraped in-cluster
        run: |
          kubectl -n gardeniot port-forward svc/gardeniot-prometheus 9090:9090 &
          sleep 5
          curl -sf 'http://localhost:9090/api/v1/query?query=gardeniot_device_true_humidity_percent' | grep -q '"device":"basil"'

      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl -n gardeniot get pods -o wide || true
          for pod in $(kubectl -n gardeniot get pods -o name); do
            echo "=== $pod"
            kubectl -n gardeniot describe "$pod" | sed -n '/^Events/,$p' | tail -15
            kubectl -n gardeniot logs "$pod" --tail=40 --all-containers || true
          done
