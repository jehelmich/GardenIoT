name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gardeniot

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned images
        run: |
          version="${GITHUB_REF_NAME#v}"
          for module in controller simulated-device garden-ui; do
            docker buildx build --push --platform linux/amd64,linux/arm64 \
              --build-arg MODULE="$module" \
              -t "$IMAGE_PREFIX-$module:$version" -t "$IMAGE_PREFIX-$module:latest" .
          done

      - name: Release notes from the commit log
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${previous:+$previous..}${GITHUB_REF_NAME}
          {
            echo "## Changes"
            git log --no-merges --format='- %s' "$range"
            echo
            echo "## Images"
            echo '```'
            for module in controller simulated-device garden-ui; do echo "$IMAGE_PREFIX-$module:${GITHUB_REF_NAME#v}"; done
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            controller/target/controller.jar
            simulated-device/target/simulated-device.jar
            garden-ui/target/garden-ui.jar
