# Mosquitto for the local profile: plain MQTT, no authentication.
# Fine on a laptop or inside a private cluster network; put credentials and TLS in front of it
# (password_file / cafile, and MQTT_USERNAME / MQTT_TLS on the clients) before exposing it.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
