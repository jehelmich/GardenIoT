{{- if and .Values.mosquitto.enabled (eq .Values.transport "mqtt") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gardeniot.fullname" . }}-mosquitto
  labels:
    {{- include "gardeniot.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
{{ .Files.Get "files/mosquitto.conf" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardeniot.fullname" . }}-mosquitto
  labels:
    {{- include "gardeniot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gardeniot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gardeniot.fullname" . }}-mosquitto
  labels:
    {{- include "gardeniot.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gardeniot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mosquitto
  template:
    metadata:
      labels:
        {{- include "gardeniot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mosquitto
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: {{ .Values.mosquitto.image }}
          args: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 15
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.mosquitto.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "gardeniot.fullname" . }}-mosquitto
{{- end }}
