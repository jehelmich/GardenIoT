# The whole system on one machine, no cloud account needed:
#
#   docker compose up --build
#
# Two plants (basil, mint) dry out, the controller waters them. Watch the logs, or open
#   http://localhost:8088   the garden page: watch, water, break sensors, add plants, change speed
#   http://localhost:3000   Grafana, with the GardenIoT dashboard provisioned
#   http://localhost:9090   Prometheus
#
# Add a third device process with its own plant:
#   docker compose run -d -e DEVICE_IDS=thyme device

name: gardeniot

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/helm/gardeniot/files/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 6

  controller:
    build:
      context: .
      args:
        MODULE: controller
    image: ghcr.io/jehelmich/gardeniot-controller:local
    environment:
      TRANSPORT: mqtt
      MQTT_HOST: mosquitto
      HUMIDITY_THRESHOLD: ${HUMIDITY_THRESHOLD:-25}
      WATERING_COOLDOWN_SECONDS: ${WATERING_COOLDOWN_SECONDS:-60}
    ports:
      - "8081:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  device:
    build:
      context: .
      args:
        MODULE: simulated-device
    image: ghcr.io/jehelmich/gardeniot-simulated-device:local
    environment:
      TRANSPORT: mqtt
      MQTT_HOST: mosquitto
      DEVICE_IDS: ${DEVICE_IDS:-basil,mint}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  garden-ui:
    build:
      context: .
      args:
        MODULE: garden-ui
    image: ghcr.io/jehelmich/gardeniot-garden-ui:local
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "8088:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/helm/gardeniot/files/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - controller
      - device

  grafana:
    image: grafana/grafana:13.0.8
    ports:
      - "3000:3000"
    environment:
      # A demo, so no login: anyone who can reach the port is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/helm/gardeniot/files/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/helm/gardeniot/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
